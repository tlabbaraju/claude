<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Request — Project Request System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <span class="nav-brand">Project Request System</span>
    <div class="nav-user">
      <span>Logged in as <strong id="nav-username">…</strong></span>
      <button class="btn-ghost" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Edit Project Request</h1>
    </div>

    <div class="form-card">
      <div id="error-msg" class="alert alert-error"></div>

      <form id="edit-request-form">
        <div class="form-group">
          <label for="project_name">Project Name <span style="color:#dc2626">*</span></label>
          <input type="text" id="project_name" name="project_name" required />
        </div>

        <div class="form-group">
          <label for="request_date">Request Date <span style="color:#dc2626">*</span></label>
          <input type="date" id="request_date" name="request_date" required />
        </div>

        <div class="form-group">
          <label for="requestor">Requestor <span style="color:#dc2626">*</span></label>
          <input type="text" id="requestor" name="requestor" required />
        </div>

        <div class="form-group">
          <label for="description">Description <span style="color:#dc2626">*</span></label>
          <textarea id="description" name="description" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="it_comments">IT Comments</label>
          <textarea id="it_comments" name="it_comments" rows="3" placeholder="Optional notes from IT…"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Save Changes</button>
          <a href="/dashboard.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/edit-request.js"></script>
</body>
</html>
