<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management — Project Request System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <div class="nav-brand">
      <a href="/menu.html" class="nav-back">&larr; Menu</a>
      Project Request System
    </div>
    <div class="nav-user">
      <span>Logged in as <strong id="nav-username">…</strong></span>
      <button class="btn-ghost" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>User Management</h1>
      <a href="/user-edit.html" class="btn">+ Add User</a>
    </div>

    <div id="error-msg" class="alert alert-error"></div>

    <div class="table-card">
      <div class="table-toolbar">
        <span class="table-toolbar-title">All Users</span>
        <span class="record-count" id="record-count">Loading…</span>
      </div>

      <table id="users-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Username</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="4" style="text-align:center;padding:3rem;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
