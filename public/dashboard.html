<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <span class="nav-brand">Financial Tracker</span>
    <div id="entityBadges" class="nav-links"></div>
    <div class="nav-user">
      <strong id="navUser"></strong>
      <button class="btn-ghost" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <main>
    <div id="alert" class="alert"></div>

    <div class="page-header">
      <h1>My Financial Data</h1>
      <div style="display:flex;gap:0.75rem;align-items:flex-end;">
        <div class="filter-group">
          <label style="font-size:0.78rem;font-weight:600;color:var(--text-sm)">Year</label>
          <select id="yearSelect" style="width:100px;"></select>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="current_estimate">Current Estimate</button>
      <button class="tab-btn" data-tab="past_due_31plus">Past Due 31+</button>
      <button class="tab-btn" data-tab="total_past_due">Total Past Due</button>
    </div>

    <div class="fin-table-wrap">
      <div class="table-toolbar">
        <span class="table-toolbar-title" id="toolbarTitle">Current Estimate</span>
        <span class="record-count" id="recordCount">0 entities</span>
      </div>
      <table class="fin-table">
        <thead>
          <tr>
            <th style="text-align:left">Entity</th>
            <th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th>
            <th>May</th><th>Jun</th><th>Jul</th><th>Aug</th>
            <th>Sep</th><th>Oct</th><th>Nov</th><th>Dec</th>
            <th style="text-align:center">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none">
        No entities are assigned to your account yet.
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const TAB_LABELS = {
      current_estimate: 'Current Estimate',
      past_due_31plus:  'Past Due 31+',
      total_past_due:   'Total Past Due',
    };

    let user = null;
    let allRows = [];
    let activeTab = 'current_estimate';
    let year = new Date().getFullYear();

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function init() {
      user = await checkAuth();
      if (!user) return;
      document.getElementById('navUser').textContent = user.username;

      const badgesEl = document.getElementById('entityBadges');
      (user.entities || []).forEach(e => {
        const span = document.createElement('span');
        span.className = 'entity-badge';
        span.textContent = e;
        badgesEl.appendChild(span);
      });

      const sel = document.getElementById('yearSelect');
      const cy = new Date().getFullYear();
      for (let y = cy + 1; y >= cy - 3; y--) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        if (y === cy) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.addEventListener('change', () => { year = Number(sel.value); loadData(); });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTab = btn.dataset.tab;
          renderTable();
        });
      });

      await loadData();
    }

    async function loadData() {
      const alertEl = document.getElementById('alert');
      alertEl.style.display = 'none';
      try {
        const res = await fetch(`/api/financial/mine/${year}`);
        if (!res.ok) throw new Error('Failed to load data');
        allRows = await res.json();
        renderTable();
      } catch (err) {
        showAlert(alertEl, err.message);
      }
    }

    function renderTable() {
      const fetched = allRows.filter(r => r.tab_type === activeTab);

      // Show a row for every assigned entity — blank zeros if no DB record yet
      const rows = (user.entities || []).map(entity =>
        fetched.find(r => r.entity === entity) ||
        { entity, year, tab_type: activeTab, ...Object.fromEntries(MONTHS.map(m => [m, 0])) }
      );

      const tbody = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');

      document.getElementById('toolbarTitle').textContent = TAB_LABELS[activeTab];
      document.getElementById('recordCount').textContent =
        `${rows.length} ${rows.length === 1 ? 'entity' : 'entities'}`;

      if (rows.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = rows.map(row => `
        <tr class="dashboard-row" data-entity="${esc(row.entity)}" data-tab="${esc(row.tab_type)}">
          <td class="entity-cell">${esc(row.entity)}</td>
          ${MONTHS.map(m => `
            <td><input type="number" class="month-input" data-month="${m}"
              value="${row[m] ?? 0}" step="any"></td>
          `).join('')}
          <td class="actions-cell">
            <button class="btn btn-sm" onclick="saveRow(this)">Save</button>
          </td>
        </tr>
      `).join('');
    }

    async function saveRow(btn) {
      const tr = btn.closest('tr');
      const entity = tr.dataset.entity;
      const tab_type = tr.dataset.tab;
      const body = {};
      tr.querySelectorAll('.month-input').forEach(inp => {
        body[inp.dataset.month] = inp.value === '' ? 0 : Number(inp.value);
      });

      btn.disabled = true;
      btn.textContent = 'Saving…';
      const alertEl = document.getElementById('alert');

      try {
        const res = await fetch(
          `/api/financial/${encodeURIComponent(entity)}/${year}/${tab_type}`,
          { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        );
        if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'Save failed'); }

        const idx = allRows.findIndex(r => r.entity === entity && r.tab_type === tab_type);
        if (idx !== -1) Object.assign(allRows[idx], body);
        else allRows.push({ entity, year, tab_type, ...body });

        tr.classList.add('saved-flash');
        setTimeout(() => tr.classList.remove('saved-flash'), 1200);
        showAlert(alertEl, `Saved — ${entity}`, 'success');
      } catch (err) {
        showAlert(alertEl, err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    }

    init();
  </script>
</body>
</html>
