<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Project Request System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <span class="nav-brand">Project Request System</span>
    <div class="nav-user">
      <span>Logged in as <strong id="nav-username">…</strong></span>
      <button class="btn-ghost" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Project Requests</h1>
      <a href="/new-request.html" class="btn">+ New Request</a>
    </div>

    <div id="error-msg" class="alert alert-error"></div>

    <div class="table-card">
      <div class="table-toolbar">
        <span class="table-toolbar-title">All Requests</span>
        <span class="record-count" id="record-count">Loading…</span>
      </div>

      <table id="requests-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Project Name</th>
            <th>Request Date</th>
            <th>Requestor</th>
            <th>Description</th>
            <th>IT Comments</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="requests-tbody">
          <tr><td colspan="7" style="text-align:center;padding:3rem;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
