<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Tracker — Audit Log</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .month-cap { text-transform: capitalize; }
    .tab-label { font-size: 0.78rem; white-space: nowrap; }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">Financial Tracker</span>
    <div class="nav-links">
      <a href="/admin-grid.html" class="nav-link">Financial</a>
      <a href="/admin-users.html" class="nav-link">Users</a>
      <a href="/admin-audit.html" class="nav-link active">Audit</a>
    </div>
    <div class="nav-user">
      <strong id="navUser"></strong>
      <span class="role-badge role-admin">Admin</span>
      <button class="btn-ghost" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <main>
    <div id="alert" class="alert"></div>

    <div class="page-header">
      <h1>Audit Log</h1>
      <button class="btn btn-secondary" onclick="loadAudit()">Refresh</button>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="filter-group">
        <label>Entity</label>
        <input type="text" id="fEntity" placeholder="All entities" style="width:180px"
          onkeydown="if(event.key==='Enter')loadAudit()">
      </div>
      <div class="filter-group">
        <label>Year</label>
        <select id="fYear">
          <option value="">All years</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Tab Type</label>
        <select id="fTab">
          <option value="">All tabs</option>
          <option value="current_estimate">Current Estimate</option>
          <option value="past_due_31plus">Past Due 31+</option>
          <option value="total_past_due">Total Past Due</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Show</label>
        <select id="fLimit" style="width:110px">
          <option value="100">100 rows</option>
          <option value="250" selected>250 rows</option>
          <option value="500">500 rows</option>
        </select>
      </div>
      <button class="btn" onclick="loadAudit()" style="align-self:flex-end">Apply</button>
    </div>

    <!-- Audit table -->
    <div class="fin-table-wrap">
      <div class="table-toolbar">
        <span class="table-toolbar-title">Changes</span>
        <span class="record-count" id="recordCount">0 entries</span>
      </div>
      <table class="data-table" style="min-width:860px">
        <thead>
          <tr>
            <th>Entity</th>
            <th>Year</th>
            <th>Tab Type</th>
            <th>Month</th>
            <th style="text-align:right">Old Value</th>
            <th style="text-align:right">New Value</th>
            <th style="text-align:right">Delta</th>
            <th>Changed By</th>
            <th>Changed At</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none">
        No audit entries match the current filters.
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    const TAB_LABELS = {
      current_estimate: 'Current Estimate',
      past_due_31plus:  'Past Due 31+',
      total_past_due:   'Total Past Due',
    };

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDateTime(s) {
      if (!s) return '—';
      return new Date(s.replace(' ', 'T') + 'Z')
        .toLocaleString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit', hour12: true,
        });
    }

    function fmtVal(v) {
      return (v === null || v === undefined) ? '<span style="color:#94a3b8">—</span>' : fmt(v);
    }

    function fmtDelta(oldVal, newVal) {
      const o = oldVal ?? 0;
      const n = newVal ?? 0;
      const d = n - o;
      if (d === 0) return '<span style="color:#94a3b8">0</span>';
      const s = fmt(Math.abs(d));
      return d > 0
        ? `<span class="delta-pos">+${s}</span>`
        : `<span class="delta-neg">-${s}</span>`;
    }

    async function init() {
      const user = await checkAuth('admin');
      if (!user) return;
      document.getElementById('navUser').textContent = user.username;

      const yearSel = document.getElementById('fYear');
      const cy = new Date().getFullYear();
      for (let y = cy + 1; y >= cy - 3; y--) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        if (y === cy) opt.selected = true;
        yearSel.appendChild(opt);
      }

      await loadAudit();
    }

    async function loadAudit() {
      const alertEl = document.getElementById('alert');
      alertEl.style.display = 'none';

      const params = new URLSearchParams();
      const entity   = document.getElementById('fEntity').value.trim();
      const year     = document.getElementById('fYear').value;
      const tab_type = document.getElementById('fTab').value;
      const limit    = document.getElementById('fLimit').value;

      if (entity)   params.set('entity', entity);
      if (year)     params.set('year', year);
      if (tab_type) params.set('tab_type', tab_type);
      params.set('limit', limit);

      try {
        const res = await fetch(`/api/audit?${params}`);
        if (!res.ok) throw new Error('Failed to load audit log');
        const rows = await res.json();
        renderTable(rows, Number(limit));
      } catch (err) {
        showAlert(alertEl, err.message);
      }
    }

    function renderTable(rows, limit) {
      const tbody = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('recordCount');

      count.textContent = rows.length === limit
        ? `${rows.length} entries (limit reached)`
        : `${rows.length} ${rows.length === 1 ? 'entry' : 'entries'}`;

      if (rows.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><strong>${esc(r.entity)}</strong></td>
          <td class="num-cell" style="text-align:left">${r.year}</td>
          <td class="tab-label">${esc(TAB_LABELS[r.tab_type] ?? r.tab_type)}</td>
          <td class="month-cap">${esc(r.month)}</td>
          <td class="num-cell">${fmtVal(r.old_value)}</td>
          <td class="num-cell">${fmtVal(r.new_value)}</td>
          <td class="num-cell">${fmtDelta(r.old_value, r.new_value)}</td>
          <td>${esc(r.changed_by)}</td>
          <td class="date-cell">${fmtDateTime(r.changed_at)}</td>
        </tr>
      `).join('');
    }

    init();
  </script>
</body>
</html>
